appId: com.tramotak.app
productName: Tramotak
copyright: Copyright © 2026 Gabriel Waltrich
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # pdf.js no processo principal só usa o build "legacy" (texto para a IA); o leitor já vai empacotado na interface.
  # O canvas nativo (dependência opcional) não é usado: só desenho no Node, que o app não faz.
  - '!node_modules/@napi-rs/**'
  - '!node_modules/pdfjs-dist/{build,web,image_decoders,types}/**'
  - '!node_modules/pdfjs-dist/**/*.map'
icon: resources/icon.png
# Transcrição embutida: whisper-cli compilado por scripts/build-whisper.sh (fica em resources/whisper).
extraResources:
  - from: build/whisper
    to: whisper
    filter: ['whisper-cli', 'whisper-cli.exe', 'whisper.cpp-LICENSE.txt']
  # Licença do Tramotak (GPL-3.0), aberta por Configurações → Sobre.
  - from: LICENSE
    to: LICENSE.txt
  # Curso de exemplo da primeira execução (gerado por scripts/build-sample-course.ts).
  - from: resources/sample-course
    to: sample-course
# O FFmpeg embutido precisa ficar fora do asar para poder ser executado.
asarUnpack:
  - node_modules/ffmpeg-static/**
win:
  target: [nsis, portable]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  target: [AppImage, deb]
  # Vários tamanhos (gerados por scripts/prepare-icon.py) para menus e barras de tarefa.
  icon: resources/icons
  category: Education
  maintainer: Gabriel Waltrich <64818081+gabrielwaltrich@users.noreply.github.com>
  synopsis: Central de estudos para os seus cursos
  syncDesktopName: true
# Releases do GitHub: gera latest*.yml e o app-update.yml usados pela atualização automática.
publish:
  provider: github
  owner: gabrielwaltrich
  repo: Tramotak
  releaseType: release
