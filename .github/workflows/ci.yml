name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Gera os instaladores sem publicar (para testar o empacotamento antes de criar a tag).
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - name: Playwright (Linux, com tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - name: Playwright
        if: runner.os != 'Linux'
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/

  package:
    name: Instaladores (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      # Transcrição embutida: whisper-cli compilado para este sistema (no macOS, universal arm64 + x64).
      - name: Cache do whisper.cpp
        uses: actions/cache@v6
        with:
          path: build/whisper
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/build-whisper.sh') }}
      - name: Compilar o whisper-cli
        shell: bash
        run: |
          if [ ! -f build/whisper/whisper-cli ] && [ ! -f build/whisper/whisper-cli.exe ]; then
            WHISPER_MAC_ARCHS="arm64;x86_64" scripts/build-whisper.sh
          fi
          ls -la build/whisper
      - name: Instaladores
        if: runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # O ffmpeg-static baixa o binário da arquitetura da máquina. O runner é Apple Silicon:
      # gera o .dmg arm64, troca o FFmpeg pelo de Intel e gera o .dmg x64.
      - name: Instaladores macOS (arm64 e x64, cada um com o FFmpeg da sua arquitetura)
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac --arm64 --publish never
          rm -f node_modules/ffmpeg-static/ffmpeg node_modules/ffmpeg-static/ffmpeg.*
          npm_config_arch=x64 npm rebuild ffmpeg-static
          file node_modules/ffmpeg-static/ffmpeg | grep -q x86_64
          npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: tramotak-${{ github.ref_name }}-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Release no GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Criar a Release com os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Tramotak ${GITHUB_REF_NAME#v}" \
            --notes-file "$NOTES" \
            --verify-tag
